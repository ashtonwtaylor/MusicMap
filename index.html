<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Map</title>
    <link href="styles/style.css" rel="stylesheet" />
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div id="map"></div>

    <div id="station-panel">
        <h2 id="country-name"></h2>
        <ul id="station-list"></ul>
    </div>

    <div id="player-bar">
        <span id="now-playing-name">No station playing</span>
        <button id="play-stop-btn">Stop</button>
        <button id="mute-btn">Mute</button>
        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" />
        <span id="player-error"></span>
    </div>

    <script src="script.js"></script>
</body>

</html>
